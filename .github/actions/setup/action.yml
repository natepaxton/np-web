name: Setup workspace
description: Node, dependencies, and Nx base/head SHAs.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: .tool-versions
        cache: npm

    - name: Install npm dependencies
      shell: bash
      run: npm ci

    # Sets NX_BASE / NX_HEAD so `nx affected` compares against the right commits.
    - uses: nrwl/nx-set-shas@v5
