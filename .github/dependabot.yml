# Dependabot version updates. Security updates are enabled separately in the repo settings.
# Docs: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    # Wait before proposing brand-new releases (limits exposure to compromised or broken publishes).
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    labels:
      - dependencies
    # Major upgrades of these go through their own tooling, not a version bump:
    # `nx migrate` for Nx and Angular (it also updates code and config), the Spartan CLI's
    # migrate-* generators for spartan/ui. TypeScript and @types/node follow Angular and Node.
    ignore:
      - dependency-name: 'nx'
        update-types: ['version-update:semver-major']
      - dependency-name: '@nx/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'angular-eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-preset-angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: '@spartan-ng/*'
        update-types: ['version-update:semver-major']
    # Groups are matched in order; a dependency joins the first group it matches.
    # Nx packages must stay on the same version, so they always move together.
    groups:
      nx:
        patterns:
          - 'nx'
          - '@nx/*'
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@schematics/angular'
          - 'angular-eslint'
          - 'ng-packagr'
          - 'jest-preset-angular'
      ui-styling:
        patterns:
          - '@spartan-ng/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tailwind-merge'
          - 'tw-animate-css'
          - 'class-variance-authority'
          - 'clsx'
          - 'postcss'
          - 'autoprefixer'
      # Everything else: minor and patch updates in one PR. Other major updates arrive as individual PRs.
      minor-and-patch:
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # NuGet packages (Directory.Packages.props, project SDK versions) and .NET local tools (dotnet-tools.json).
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      # Aspire hosting packages, the AppHost SDK, and the Aspire CLI ship together.
      aspire:
        patterns:
          - 'Aspire.*'
      aspnetcore-and-extensions:
        patterns:
          - 'Microsoft.AspNetCore.*'
          - 'Microsoft.Extensions.*'
      opentelemetry:
        patterns:
          - 'OpenTelemetry*'
      testing:
        patterns:
          - 'xunit*'
          - 'coverlet*'
          - 'dotnet-reportgenerator-globaltool'
      minor-and-patch:
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - '*'

  # .NET SDK version in global.json.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    commit-message:
      prefix: deps
    labels:
      - dependencies
    # Stay on the .NET 10 LTS line; moving to a new major is a deliberate upgrade.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
