[build]
  command = "sed -i \"s/__STADIA_API_KEY_PLACEHOLDER__/$STADIA_API_KEY/g\" apps/yellowstone/src/environments/environment.prod.ts && npx nx build yellowstone"
  publish = "dist/apps/yellowstone/browser"

[build.environment]
  NODE_VERSION = "22"
  # Exclude the environment file from secret scanning since we inject the API key at build time
  SECRETS_SCAN_OMIT_PATHS = "apps/yellowstone/src/environments/environment.prod.ts"
